services:
  agropac-event-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://agropac:agropac@db:5432/agropac
      - ADMIN_PASSWORD=agropac2026
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=agropac
      - POSTGRES_PASSWORD=agropac
      - POSTGRES_DB=agropac
    volumes:
      - agropac_db_data:/var/lib/postgresql/data

volumes:
  agropac_db_data:
