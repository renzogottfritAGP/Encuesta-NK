services:
  agropack-event-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://agropack:agropack@db:5432/agropack
      - ADMIN_PASSWORD=agropac2026
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=agropack
      - POSTGRES_PASSWORD=agropack
      - POSTGRES_DB=agropack
    volumes:
      - agropack_db_data:/var/lib/postgresql/data

volumes:
  agropack_db_data:
